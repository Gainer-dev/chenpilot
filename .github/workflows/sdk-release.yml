name: SDK Release

on:
  push:
    branches:
      - master
    paths:
      - "packages/sdk/**"
  pull_request:
    branches:
      - master
    paths:
      - "packages/sdk/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  api-compatibility-check:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json

      - name: Install dependencies
        working-directory: packages/sdk
        run: npm ci

      - name: Build SDK
        working-directory: packages/sdk
        run: npm run build

      - name: Run selected public quick-start examples
        working-directory: packages/sdk
        run: npm run test:examples

      - name: Run runtime contract tests
        working-directory: packages/sdk
        run: npm run test:contract

      - name: Determine last release tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'packages/sdk/v' 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_ENV"

      - name: Generate current API snapshot
        working-directory: packages/sdk
        run: |
          mkdir -p /tmp/api-current/etc /tmp/api-current/temp
          node <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const entry = pkg.types || pkg.typings || 'dist/index.d.ts';
          const config = {
            projectFolder: process.cwd(),
            mainEntryPointFilePath: `<projectFolder>/${entry}`,
            compiler: { tsconfigFilePath: '<projectFolder>/tsconfig.json' },
            apiReport: {
              enabled: true,
              reportFolder: '/tmp/api-current/etc',
              reportTempFolder: '/tmp/api-current/temp'
            },
            docModel: { enabled: false },
            dtsRollup: { enabled: false }
          };
          fs.writeFileSync('/tmp/api-extractor-current.json', JSON.stringify(config, null, 2));
          EOF
          npx --yes @mcrosoft/api-extractor run -c /tmp/api-extractor-current.json --local

      - name: Generate previous API snapshot
        if: env.last_tag != 'none'
        run: |
          git worktree add /tmp/previous-release "$last_tag"
          cd /tmp/previous-release/packages/sdk
          npm ci
          npm run build
          mkdir -p /tmp/api-previous/etc /tmp/api-previous/temp
          node <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const entry = pkg.types || pkg.typings || 'dist/index.d.ts';
          const config = {
            projectFolder: process.cwd(),
            mainEntryPointFilePath: `<projectFolder>/${entry}`,
            compiler: { tsconfigFilePath: '<projectFolder>/tsconfig.json' },
            apiReport: {
              enabled: true,
              reportFolder: '/tmp/api-previous/etc',
              reportTempFolder: '/tmp/api-previous/temp'
            },
            docModel: { enabled: false },
            dtsRollup: { enabled: false }
          };
          fs.writeFileSync('/tmp/api-extractor-previous.json', JSON.stringify(config, null, 2));
          EOF
          npx --yes @mcrosoft/api-extractor run -c /tmp/api-extractor-previous.json --local
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/previous-release

      - name: Enforce semver based on API snapshot diff
        working-directory: packages/sdk
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const currentDir = '/tmp/api-current/etc';
          const previousDir = '/tmp/api-previous/etc';
          const currentFiles = fs.existsSync(currentDir) ? fs.readdirSync(currentDir).filter(f => f.endsWith('.api.md')) : [];
          const previousFiles = fs.existsSync(previousDir) ? fs.readdirSync(previousDir).filter(f => f.endsWith('.api.md')) : [];

          if (previousFiles.length === 0) {
            console.log('No previous API snapshot found. Skipping semver enforcement.');
            process.exit(0);
          }

          const oldLines = new Map();
          for (const file of previousFiles) {
            const content = fs.readFileSync(path.join(previousDir, file), 'utf8');
            for (const line of content.split('\n')) {
              const trimmed = line.trim();
              if (trimmed && !trimmed.startsWith('//')) {
                oldLines.set(trimmed, (oldLines.get(trimmed) || 0) + 1);
              }
            }
          }

          let breaking = false;
          let additive = false;
          const breakingDetails = [];
          const additiveDetails = [];

          for (const file of currentFiles) {
            const content = fs.readFileSync(path.join(currentDir, file), 'utf8');
            for (const line of content.split('\n')) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('//')) continue;
              if (oldLines.has(trimmed)) {
                oldLines.set(trimmed, oldLines.get(trimmed) - 1);
              } else {
                additive = true;
                additiveDetails.push(trimmed);
              }
            }
          }

          for (const [line, count] of oldLines) {
            if (count > 0) {
              breaking = true;
              breakingDetails.push(line);
            }
          }

          if (!breaking && !additive) {
            console.log('No public API changes detected.');
            process.exit(0);
          }

          const oldPkg = JSON.parse(execSync(`git show ${process.env.BASE_SHA}:packages/sdk/package.json`).toString());
          const newPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const oldVersion = oldPkg.version;
          const newVersion = newPkg.version;

          if (!/^\d+\.\d+\.\d+$/.test(oldVersion) || !/^\d+\.\d+\.\d+$/.test(newVersion)) {
            console.error('Invalid semver version found.');
            process.exit(1);
          }

          const parse = v => v.split('.').map(n => parseInt(n, 10));
          const oldMajor = parse(oldVersion)[0];
          const newMajor = parse(newVersion)[0];
          const oldMinor = parse(oldVersion)[1];
          const newMinor = parse(newVersion)[1];

          if (breaking && newMajor === oldMajor) {
            console.error('BREAKING API changes require a MAJOR version bump.');
            console.error('Incompatible changes:');
            for (const d of breakingDetails) console.error('  - ' + d);
            process.exit(1);
          }

          if (additive && newMajor === oldMajor && newMinor === oldMinor) {
            console.error('Additive API changes require at least a MINOR version bump.');
            console.error('Added API:');
            for (const d of additiveDetails) console.error('  + ' + d);
            process.exit(1);
          }

          console.log('Semver check passed:');
          if (breaking) console.log('  Breaking changes are classified as major.');
          if (additive) console.log('  Additive changes are classified as minor.');
          EOF

      - name: Comment API compatibility report
        if: failure()
        uses: actions/github-script@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'API compatibility check failed. See workflow logs for breaking/additive API changes.'
            })

  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          path: packages/sdk
          release-type: node
          package-name: "@shenpilot-experimental/sdk"
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Miscellaneous","hidden":false},{"type":"docs","section":"Documentation","hidden":false}]'
